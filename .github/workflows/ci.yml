# Builds and tests on every push. Cloud Claude Code sessions have no Xcode,
# so this workflow is how iOS changes get verified before they reach you.
name: CI

on:
  push:
    branches-ignore:
      - ci-screenshots
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest installed Xcode (non-beta)
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID="$(scripts/pick-simulator.sh)"
          xcrun simctl list devices available | grep "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      # CI builds without code signing: simulators don't need it, and it keeps
      # the team ID out of CI.
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # Not -quiet here: that would also hide the per-test results.
      - name: Test
        run: |
          xcodebuild test-without-building \
            -project App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  database:
    name: Database access rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Start Postgres with migrations and seed
        run: supabase db start

      - name: Run pgTAP access-rule tests
        run: supabase test db

  # Captures demo-mode screens on a small and a large iPhone (light and dark) and
  # publishes them to the ci-screenshots branch, so the design can be reviewed
  # from anywhere: `git fetch origin ci-screenshots`.
  screenshots:
    name: Screenshots (demo mode)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SCREENS: "welcome device goals group sharing today today-bottom team team-bottom trends trends-bottom profile profile-bottom"
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest installed Xcode (non-beta)
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the app for the simulator
        run: |
          xcodegen generate
          UDID="$(scripts/pick-simulator.sh)"
          xcodebuild build -project App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData -quiet CODE_SIGNING_ALLOWED=NO

      - name: Capture screenshots
        run: scripts/screenshots.sh DerivedData/Build/Products/Debug-iphonesimulator/App.app shots

      - name: Publish to the ci-screenshots branch
        run: |
          cd shots
          echo "Screenshots of ${GITHUB_SHA} (${GITHUB_REF_NAME}), $(date -u +%FT%TZ)" > SOURCE.txt
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
