# XcodeGen spec: the source of truth for the Xcode project.
# Regenerate after any change:   xcodegen generate
# Never edit App.xcodeproj by hand; it is git-ignored and rebuilt from this file.
#
# App identity (display name, bundle ID, App Group, domain, team) lives in
# Config/Identity.xcconfig so it can change without touching this file.

name: App

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    CODE_SIGN_STYLE: Automatic
    # Swift 6 language mode: the compiler checks for data races.
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # The one planned dependency. Pinned to an exact version because the generated
  # project (and its Package.resolved) isn't committed.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3

targets:
  App:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: WidgetExtension
      - package: Supabase
    info:
      path: Config/Generated/App-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
        NSHealthShareUsageDescription: >-
          $(APP_DISPLAY_NAME) reads your sleep, heart rate, HRV, steps, exercise
          minutes, and workouts to build daily summaries that you choose to share
          with your group. Raw readings never leave your iPhone.
        # Filled from Config/Secrets.xcconfig; empty when that file is missing.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: Config/Generated/App.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.associated-domains:
          - applinks:$(APP_DOMAIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # UI code runs on the main actor unless marked otherwise (Xcode 26+ default for new apps).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    scheme:
      testTargets:
        - Tests

  # Target name differs from the Widget/ folder so the Swift module isn't called
  # "Widget", which would clash with WidgetKit's Widget protocol.
  WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Config/Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: Config/Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
